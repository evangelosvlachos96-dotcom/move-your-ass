name: api

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Directory.Build.props'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"
        env:
          AUTOMAPPER_LICENSE_KEY: ${{ secrets.AUTOMAPPER_LICENSE_KEY }}

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish src/Mya.Api -c Release -o ./publish

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  # Migrations are applied deliberately, never automatically on app startup.
  # Trigger this job manually after reviewing the generated script.
  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef
      - name: Generate idempotent script
        run: |
          dotnet ef migrations script --idempotent \
            --project src/Mya.Infrastructure \
            --startup-project src/Mya.Api \
            --output migrate.sql
      - name: Upload script for review
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migrate.sql
