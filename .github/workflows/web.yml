name: web

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# A workflow with no permissions block inherits the repository default, which can be write.
# Nothing here writes anything back to the repository, and this runs on pull requests from forks,
# so it is pinned to read.
permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --watch=false

      - name: Build
        run: npm run build -- --configuration production

  # Deployment lives in deploy.yml: the Angular build is served from the API's wwwroot (ADR-016).
