name: web

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # ADR-014: automated tests are deferred. Vitest fails the run when no spec file exists,
      # so the step is skipped until the first spec lands; then it runs unconditionally.
      - name: Test
        run: |
          if find src -name '*.spec.ts' | grep -q .; then
            npm run test -- --watch=false
          else
            echo "No spec files yet (ADR-014); skipping tests."
          fi

      - name: Build
        run: npm run build -- --configuration production

  # Deployment lives in deploy.yml: the Angular build is served from the API's wwwroot (ADR-016).
