name: container
on:
  pull_request:
    paths: ['src/**', 'web/**', 'Dockerfile', '.dockerignore', 'Directory.Build.props', '.github/workflows/container.yml']
  push:
    branches: [main, develop]
    paths: ['src/**', 'web/**', 'Dockerfile', '.dockerignore', 'Directory.Build.props', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mya:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
