<div class="login">
  <div class="login__panel">
    <img class="login__logo" src="assets/brand/logo-stacked.svg" alt="MoveYourAss" width="160" height="92" />

    <mat-card class="login__card" appearance="outlined">
      <mat-card-header class="login__header">
        <mat-card-title>Σύνδεση</mat-card-title>
        <mat-card-subtitle>Συνδεθείτε με το email και τον κωδικό σας</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <mat-form-field class="login__field">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.hasError('required')) {
              <mat-error>Συμπλήρωσε το email</mat-error>
            } @else if (form.controls.email.hasError('email')) {
              <mat-error>Μη έγκυρο email</mat-error>
            }
          </mat-form-field>

          <mat-form-field class="login__field">
            <mat-label>Κωδικός</mat-label>
            <input
              matInput
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              matIconButton
              matSuffix
              type="button"
              (click)="hidePassword.set(!hidePassword())"
              [attr.aria-label]="hidePassword() ? 'Εμφάνιση κωδικού' : 'Απόκρυψη κωδικού'"
              [attr.aria-pressed]="!hidePassword()"
            >
              <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            @if (form.controls.password.hasError('required')) {
              <mat-error>Συμπλήρωσε τον κωδικό</mat-error>
            }
          </mat-form-field>

          <button matButton="filled" type="submit" class="login__submit" [disabled]="submitting()">
            @if (submitting()) {
              Σύνδεση…
            } @else {
              Σύνδεση
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
