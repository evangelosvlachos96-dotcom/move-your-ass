<section class="dashboard">
  <header class="dashboard__header">
    <h1 class="dashboard__title">Καλώς ήρθες, {{ store.user()?.firstName }}</h1>
    <p class="dashboard__subtitle">
      Συνδεδεμένος/η ως <strong>{{ store.fullName() }}</strong>
      <span class="dashboard__role">{{ roleLabel() }}</span>
    </p>
  </header>

  <mat-card class="dashboard__card" appearance="outlined">
    <mat-card-content>
      <p class="dashboard__muted">Η βιβλιοθήκη βίντεο έρχεται σε επόμενη φάση.</p>
    </mat-card-content>
  </mat-card>
</section>
