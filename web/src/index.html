<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <base href="/" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) return anything other than zero on
      an iPhone. Without it the fixed bottom bar and the footer sit under the home indicator and
      the notch, and every safe-area rule in the stylesheets is silently a no-op. Because the
      layout then extends under the insets, the shell pads for them explicitly.

      No maximum-scale and no user-scalable=no: pinch-zoom stays available. The way to stop iOS
      zooming on focus is a font-size of at least 16px on the control, which styles.scss enforces.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>MoveYourAss</title>
    <meta name="description" content="Προπόνηση, όποτε θέλεις" />

    <link rel="icon" href="favicon.ico" sizes="32x32" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="theme-color" content="#0E0E10" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="MoveYourAss" />
    <meta property="og:description" content="Προπόνηση, όποτε θέλεις" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"

    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>

  </body>
